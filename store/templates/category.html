{% extends 'base.html' %}
{% load static %}

{% block title %}{{ category.name }}{% endblock %}

{% block content %}

<h1>{{ category.name }}</h1>

<div class="row g-4">

    {% for product in products %}
        {% include 'includes/product_card.html' %}
    {% empty %}
        <p>No products available.</p>
    {% endfor %}

</div>

<a href="{% url 'store:index' %}">Back to Home</a>

{% endblock %}
